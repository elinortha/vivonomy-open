id: pt-alkali
name: Alkaline (NaOH / lime)
type: pretreatment
category: cat-pt-chem
process_family: chemical
description: Alkaline pretreatment with sodium hydroxide or lime disrupts lignin–carbohydrate ester bonds and removes acetyl groups from hemicellulose, swelling the cellulose structure and improving cellulase accessibility. It is particularly effective on agricultural residues with lower lignin content. Lime-based pretreatment is lower-cost and generates less wastewater than NaOH, but requires longer residence times (hours to days).
aliases:
  - NaOH pretreatment
  - lime pretreatment
  - alkaline pretreatment
mechanism_brief: Sodium hydroxide or Ca(OH)₂ at moderate temperatures (40–130°C) saponifies ester linkages between lignin and hemicellulose, swells cellulose crystallinity, and removes acetyl groups — all of which improve enzyme accessibility.
chemical_inputs:
  - NaOH or lime (Ca(OH)₂)
  - water
environmental_impacts:
  - alkaline wastewater requiring neutralization
  - calcium carbonate sludge from lime processes
