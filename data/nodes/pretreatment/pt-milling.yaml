id: pt-milling
name: Milling & size reduction
type: pretreatment
category: cat-pt-mech
process_family: physical
description: Milling mechanically reduces biomass particle size to increase surface area accessible to enzymes or heat-transfer fluids. Smaller particles (1–2 mm) improve enzymatic hydrolysis rates and homogenize feedstock variability for thermochemical processes. Energy consumption scales with target particle size; fine milling (<1 mm) can be energy-intensive enough to offset conversion efficiency gains.
aliases:
  - grinding
  - hammer milling
  - ball milling
  - disc milling
mechanism_brief: Hammer mills, disc mills, or ball mills reduce particle size through impact and shear, exposing more cellulose surface area to downstream enzymatic or thermal attack.
environmental_impacts:
  - dust generation
  - noise
