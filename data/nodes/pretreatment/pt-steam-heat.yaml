id: pt-steam-heat
name: Steam pretreatment
type: pretreatment
category: cat-pt-thermal
process_family: thermochemical
description: Steam pretreatment exposes biomass to pressurized steam (160–240°C) for 5–15 minutes, partially hydrolyzing hemicellulose and disrupting the lignin network. The treated material becomes significantly more accessible to cellulase enzymes. Unlike chemical pretreatments, no neutralization step is required, though some inhibitory compounds (furfural, HMF) may form that need to be removed before fermentation.
aliases:
  - autohydrolysis
  - hot water extraction
  - liquid hot water pretreatment
mechanism_brief: Pressurized steam (160–240°C, 5–35 bar) dissolves acetyl groups and partially hydrolyzes hemicellulose through autohydrolysis, opening the lignocellulosic matrix without adding chemicals.
environmental_impacts:
  - steam and energy consumption
  - condensate with dissolved organics requires treatment
