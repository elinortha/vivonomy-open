id: pt-steam-exp
name: Steam explosion
type: pretreatment
category: cat-pt-physico
process_family: chemical
description: Steam explosion subjects biomass to high-pressure steam (180–240°C, 15–50 bar) and then rapidly depressurizes the vessel, causing explosive decompression that physically shatters the lignocellulosic matrix. The combination of thermal hydrolysis and mechanical disruption makes cellulose highly accessible to cellulase enzymes without requiring chemical inputs. It is one of the most studied and technically mature pretreatments for agricultural and woody residues.
aliases:
  - autohydrolysis explosion
  - STEX
mechanism_brief: Biomass is impregnated with high-pressure steam then suddenly depressurized; the explosive flash vaporization mechanically disrupts cell walls and the thermal phase partially hydrolyzes hemicellulose.
environmental_impacts:
  - inhibitor compounds in hydrolysate (furfural, phenolics)
  - high energy input for steam generation
