id: pt-fungal
name: Fungal pretreatment
type: pretreatment
category: cat-pt-bio
process_family: biochemical
description: "Fungal pretreatment uses white-rot fungi (e.g., Phanerochaete chrysosporium) to biologically degrade lignin through secreted oxidative enzymes — lignin peroxidases, laccases, and manganese peroxidases — improving cellulose accessibility without chemicals or high temperatures. It is the most environmentally benign pretreatment option, producing no inhibitory compounds. The major drawback is time: fungal colonization typically requires 1–4 weeks, making continuous industrial-scale processing impractical at current development stage."
aliases:
  - white-rot pretreatment
  - biological delignification
  - biopulping
mechanism_brief: White-rot fungi secrete extracellular ligninolytic enzymes (lignin peroxidase, laccase, Mn-peroxidase) that selectively degrade lignin's aromatic network over 1–4 weeks, leaving cellulose and hemicellulose accessible.
environmental_impacts:
  - very low — no chemical inputs or high-energy requirement; long retention time requires land area
