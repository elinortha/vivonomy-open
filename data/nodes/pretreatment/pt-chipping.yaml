id: pt-chipping
name: Chipping & screening
type: pretreatment
category: cat-pt-mech
process_family: physical
description: Chipping converts coarse woody biomass — logs, branches, and forest residues — into uniform chip sizes (typically 25–50 mm) required by gasifiers, combustors, and some chemical pretreatment reactors. Screening removes fines and oversized material to ensure consistent geometry. This is routine forestry and wood-processing infrastructure with a very high technology readiness level.
aliases:
  - wood chipping
  - disc chipping
  - drum chipping
mechanism_brief: Rotating disc or drum chippers reduce woody biomass to standardized chip sizes; vibrating screens separate fines and oversized pieces to ensure uniform feedstock quality.
environmental_impacts:
  - noise
  - wood dust
