id: pt-organosolv
name: Organosolv
type: pretreatment
category: cat-pt-chem
process_family: chemical
description: Organosolv pretreatment uses an organic solvent–water mixture at elevated temperature to selectively extract lignin from biomass, leaving a cellulose-enriched pulp alongside a valuable lignin-rich liquid stream. The high-purity lignin byproduct has commercial value as a chemical feedstock, which can improve overall biorefinery economics. However, solvent recovery and handling requires specialized equipment, and the process is not yet at commercial scale for most feedstocks.
aliases:
  - ethanol pretreatment
  - solvent pretreatment
  - organosolv pulping
mechanism_brief: An organic solvent (ethanol, acetone, or methanol) mixed with water at 180–200°C selectively dissolves and extracts lignin, producing a cellulose-enriched solid pulp and a concentrated lignin fraction for valorization.
chemical_inputs:
  - organic solvent (ethanol, acetone, or methanol)
  - water
  - optional acid catalyst
environmental_impacts:
  - solvent recovery energy demand
  - flammable solvent handling and storage
