id: pt-dilute-acid
name: Dilute acid
type: pretreatment
category: cat-pt-chem
process_family: chemical
description: Dilute acid pretreatment uses dilute sulfuric or hydrochloric acid (0.5–2% w/v) at 120–200°C to hydrolyze hemicellulose into pentose sugars while loosening the lignin matrix around cellulose. It is highly effective at improving subsequent enzymatic hydrolysis yields. The main drawbacks are the generation of inhibitory compounds (furfural, HMF, weak acids) that can suppress fermentation, and the need for acid recovery or neutralization steps.
aliases:
  - dilute sulfuric acid pretreatment
  - dilute H2SO4
  - acid hydrolysis pretreatment
mechanism_brief: Dilute sulfuric or hydrochloric acid (0.5–2%) at 120–200°C hydrolyzes hemicellulose to pentose sugars; the acidic environment also disrupts lignin linkages, exposing cellulose to subsequent enzymatic attack.
chemical_inputs:
  - dilute sulfuric acid or hydrochloric acid
  - water
  - base for neutralization
environmental_impacts:
  - acid waste requiring neutralization
  - inhibitor-containing hydrolysate requiring detoxification
