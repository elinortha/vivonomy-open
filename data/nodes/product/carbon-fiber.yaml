description: Bio-based carbon fiber can be produced by thermally processing lignin or cellulose-based precursors into high-strength graphitic filaments. Lignin — available as a low-cost biorefinery co-product — is being explored as a precursor for lower-cost carbon fiber, which currently commands high prices ($20–100/kg) due to energy-intensive production from petroleum-derived acrylonitrile. Bio-based carbon fiber remains at pilot scale, with mechanical performance not yet fully equivalent to PAN-derived fiber.
