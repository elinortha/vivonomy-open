id: renewable-diesel
name: Renewable diesel
type: product
category: cat-energy-p
product_function: liquid-fuel
carbon_fate: short-cycle
description: Renewable diesel is a drop-in fuel produced by hydrotreating vegetable oils or bio-oil, yielding a paraffinic hydrocarbon product with superior properties to FAME biodiesel — higher energy density, better cold-flow characteristics, and compatibility at any blend level with petroleum diesel. Unlike biodiesel, renewable diesel is chemically identical to petroleum diesel and requires no modifications to engines or fuel infrastructure.
