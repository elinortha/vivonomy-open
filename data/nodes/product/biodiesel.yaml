description: Biodiesel (fatty acid methyl ester, FAME) is produced by transesterification of vegetable oils or animal fats with methanol. It is the most commercially mature biofuel globally, with established standards (EN 14214 in Europe, ASTM D6751 in the US) and widespread blending infrastructure. FAME biodiesel has slightly lower energy density than petroleum diesel and can cause issues at high blend ratios in cold climates, but blends up to B20 are supported by most engine manufacturers.
