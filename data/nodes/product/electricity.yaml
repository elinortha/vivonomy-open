id: electricity
name: Electricity
type: product
category: cat-energy-p
product_function: energy
carbon_fate: short-cycle
description: Electricity generated from bioenergy conversion — via steam turbine (combustion or gasification), gas engine (biogas), or fuel cell (hydrogen) — can be fed to the electricity grid or used on-site. Bioenergy power is dispatchable unlike solar and wind, making it a valuable grid asset for balancing variable renewable generation. Efficiency ranges from 20–25% (small plants) to 40–45% for large combined-cycle configurations.
