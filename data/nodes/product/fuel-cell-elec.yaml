carbon_fate: short-cycle
description: Fuel cell electricity is produced by electrochemically oxidizing hydrogen in a fuel cell, converting chemical energy directly to electricity without combustion, at efficiencies of 45–60%. Polymer electrolyte membrane (PEM) fuel cells are most common for hydrogen; molten carbonate and solid oxide fuel cells can use biogas directly. Fuel cells are attractive for distributed power and transport applications where high efficiency and zero local emissions are valued.
