product_function: chemical
carbon_fate: durable
description: Specialty chemicals from biomass encompass a range of high-value compounds — including itaconic acid, succinic acid, lactic acid derivatives, aromatic chemicals from lignin, and biochemicals from amino acid fermentation. These products command significantly higher prices per tonne than biofuels, making them economically attractive at smaller scales. The term covers bio-based chemicals that are not commodity chemicals or fuels — the 'high value' in the biorefinery value pyramid.
