id: ft
name: Fischer-Tropsch
type: upgrading
category: cat-synfuel
process_family: chemical
description: Fischer-Tropsch (FT) synthesis converts syngas (CO + H₂) into liquid hydrocarbons by polymerizing CO with hydrogen over an iron or cobalt catalyst. The product is a distribution of paraffinic hydrocarbons from methane to heavy waxes; the diesel and jet fuel fractions are of high quality — ultra-low sulfur, high cetane. FT fuels from biomass-derived syngas (Biomass-to-Liquid, BtL) qualify as advanced biofuels but require large minimum scales for economic viability.
aliases:
  - FT synthesis
  - Fischer-Tropsch synthesis
  - BtL synthesis
mechanism_brief: CO and H₂ are polymerized over an iron or cobalt catalyst at 150–350°C and 10–40 bar to produce a distribution of long-chain paraffinic hydrocarbons via the Anderson-Schulz-Flory product distribution; waxes are hydrocracked to fuel-range fractions.
typical_outputs:
  - saf
  - renewable-diesel
