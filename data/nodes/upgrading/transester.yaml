id: transester
name: Transesterification
type: upgrading
category: cat-ester
process_family: chemical
description: Transesterification reacts triglycerides (vegetable or algal oil) with methanol in the presence of a base catalyst (NaOH or KOH) at 55–65°C to produce fatty acid methyl esters (FAME) — biodiesel — and glycerol as a co-product. It is the most commercially mature biodiesel production process, with thousands of plants worldwide. FAME biodiesel can be blended with petroleum diesel up to B20 without engine modifications, or used at higher concentrations in adapted vehicles.
aliases:
  - biodiesel production
  - FAME production
  - base-catalyzed transesterification
mechanism_brief: Triglycerides react with methanol at a ~6:1 molar ratio in the presence of NaOH or KOH catalyst at 55–65°C; each ester bond in the triglyceride is transesterified with a methanol molecule, releasing glycerol and producing three fatty acid methyl ester (FAME) molecules.
typical_outputs:
  - biodiesel
