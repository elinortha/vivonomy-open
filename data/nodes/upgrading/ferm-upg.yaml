id: ferm-upg
name: Fermentation
type: upgrading
category: cat-bioconv
process_family: biochemical
description: Fermentation uses microorganisms — primarily yeasts (Saccharomyces cerevisiae) for ethanol, or bacteria for organic acids and chemicals — to metabolize C5 and C6 sugars or VFAs into useful products. Conventional glucose-to-ethanol fermentation is one of the most mature bioenergy processes globally. Advanced fermentation uses engineered microorganisms to convert the same sugar platform into lactic acid (PLA bioplastic precursor), succinic acid, itaconic acid, and other bio-based chemicals.
aliases:
  - microbial fermentation
  - yeast fermentation
  - biotransformation
mechanism_brief: Microorganisms anaerobically metabolize sugars or VFAs through glycolysis and fermentative pathways; product specificity depends on the microorganism (yeast → ethanol, Lactobacillus → lactic acid, Clostridium → butanol) and process conditions.
typical_outputs:
  - ethanol
  - bioplastic
  - specialty-chem
