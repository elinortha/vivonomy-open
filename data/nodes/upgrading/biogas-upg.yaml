id: biogas-upg
name: Biogas upgrading
type: upgrading
category: cat-gasupg
process_family: physical
description: "Biogas upgrading removes CO₂ and trace contaminants from raw biogas to produce biomethane — a gas compositionally equivalent to natural gas (>96% CH₄). Multiple proven technologies are available: pressure swing adsorption (PSA), water scrubbing, membrane separation, and chemical absorption with amines. Biomethane can be injected directly into existing natural gas grid infrastructure, enabling large-scale renewable gas distribution without requiring new end-use infrastructure."
aliases:
  - biomethane production
  - biogas purification
  - PSA upgrading
  - membrane upgrading
mechanism_brief: CO₂ is selectively removed from raw biogas (55–70% CH₄) using pressure swing adsorption (PSA), water scrubbing, membrane separation, or amine absorption, yielding >96% CH₄ biomethane meeting grid injection standards.
typical_outputs:
  - biomethane
