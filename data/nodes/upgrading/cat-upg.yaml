id: cat-upg
name: Catalytic upgrading
type: upgrading
category: cat-catalytic
process_family: chemical
description: Catalytic upgrading encompasses a range of heterogeneous catalytic processes — including zeolite cracking, catalytic depolymerization, and catalytic hydrodeoxygenation — that convert platform intermediates such as bio-oil, syngas, and lignin into higher-value chemicals and materials. These routes are at earlier stages of commercial development than fuel-focused upgrading but offer substantially higher product values when targeting aromatic chemicals, bioplastic monomers, or specialty compounds.
aliases:
  - catalytic cracking
  - zeolite upgrading
  - catalytic depolymerization
mechanism_brief: Heterogeneous catalysts (zeolites, metal oxides, noble metal catalysts) crack, depolymerize, or selectively functionalize bio-oil oligomers or lignin fragments at 300–600°C to produce aromatic chemicals, monomers, or lighter functional compounds.
typical_outputs:
  - specialty-chem
  - bioplastic
  - carbon-fiber
  - bio-adhesive
