id: hydrotreat
name: Hydrotreating
type: upgrading
category: cat-hydropro
process_family: chemical
description: Hydrotreating removes oxygen, sulfur, and nitrogen from bio-oil or vegetable oil feedstocks by reacting them with high-pressure hydrogen over a NiMo or CoMo catalyst. For vegetable oils, this hydrodeoxygenation produces hydroprocessed esters and fatty acids (HEFA) — one of the most commercially advanced SAF pathways. Hydrotreating is co-processable at existing petroleum refineries, which lowers entry costs compared to greenfield biofuel plants.
aliases:
  - hydroprocessing
  - HEFA
  - hydrodeoxygenation
  - hydrotreatment
mechanism_brief: High-pressure hydrogen (50–200 bar) at 300–450°C reacts with oxygenated bio-oil or triglycerides over a NiMo or CoMo catalyst; deoxygenation reactions remove oxygen as water or CO₂ while dehydrogenation and isomerization improve fuel properties.
typical_outputs:
  - saf
  - renewable-diesel
