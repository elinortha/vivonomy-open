id: enz-hydro
name: Enzymatic hydrolysis
type: primary_conversion
category: cat-biochem
process_family: biochemical
description: Enzymatic hydrolysis uses cellulase and hemicellulase enzyme cocktails to break down the pretreated cellulose and hemicellulose in lignocellulosic biomass into C5 and C6 sugars. The process operates under mild conditions (45–55°C, pH 4.5–5.0) and produces a sugar-rich hydrolysate suitable for fermentation. Lignin remains as a solid residue and must be separated and valorized separately to improve overall process economics.
aliases:
  - enzymatic saccharification
  - cellulolysis
  - cellulose hydrolysis
mechanism_brief: Cellulase cocktails (endoglucanases, exoglucanases, β-glucosidases) and hemicellulases cleave β-1,4-glycosidic bonds in cellulose and hemicellulose at 45–55°C and pH 4.5–5.0, releasing fermentable glucose and xylose.
typical_outputs:
  - sugars
  - lignin
