id: htc
name: Hydrothermal carbonization
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Hydrothermal carbonization (HTC) processes wet biomass at moderate temperatures (180–250°C) in pressurized water for 1–12 hours, producing hydrochar — a carbon-rich solid with coal-like properties. Like HTL, it handles high-moisture feedstocks without pre-drying. The hydrochar product is energy-dense, hydrophobic, and can be used as a solid fuel, soil amendment, or activated carbon precursor.
aliases:
  - HTC
  - wet torrefaction
  - hydrothermal treatment
mechanism_brief: Wet biomass heated at 180–250°C in pressurized water undergoes dehydration and decarboxylation reactions, concentrating carbon into a coal-like hydrochar solid while releasing process water with dissolved organics.
typical_outputs:
  - biochar
