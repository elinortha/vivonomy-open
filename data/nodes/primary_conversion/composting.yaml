id: composting
name: Composting
type: primary_conversion
category: cat-biochem
process_family: biochemical
description: Composting is the controlled aerobic decomposition of organic matter by microorganisms, producing a stable soil amendment rich in humus. The thermophilic phase (55–65°C) achieved during active decomposition sanitizes pathogens and weed seeds. It is the simplest and most widely deployed biological conversion pathway for mixed organic waste, requiring minimal capital investment. Composting returns carbon to the soil rather than capturing it as energy.
aliases:
  - aerobic composting
  - windrow composting
  - in-vessel composting
mechanism_brief: A succession of aerobic microbial communities (mesophilic → thermophilic → maturation) decompose labile organics to CO₂ and water while stable humic substances accumulate; controlled aeration and moisture management maintain thermophilic conditions for pathogen kill.
typical_outputs:
  - stabilized-om
