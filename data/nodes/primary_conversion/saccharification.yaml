id: saccharification
name: Direct saccharification
type: primary_conversion
category: cat-biochem
process_family: biochemical
description: Direct saccharification converts starch-rich materials to fermentable glucose sugars using amylase enzymes (α-amylase for liquefaction, glucoamylase for saccharification). Unlike cellulosic conversion, starch hydrolysis does not require intensive physical or chemical pretreatment — the α-glycosidic bonds in starch are far more accessible to enzymes than the β-glycosidic bonds in cellulose. This is the basis of conventional corn-to-ethanol fermentation and is a well-established industrial process globally.
aliases:
  - starch saccharification
  - amylolysis
  - enzymatic starch hydrolysis
mechanism_brief: α-Amylase (liquefaction at 90–105°C) and glucoamylase (saccharification at 60°C) sequentially hydrolyze starch α-1,4 and α-1,6 glycosidic bonds to produce a glucose syrup ready for fermentation.
typical_outputs:
  - sugars
