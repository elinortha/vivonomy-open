id: extraction
name: Mechanical separation & extraction
type: primary_conversion
category: cat-physical
process_family: physical
description: Mechanical separation and extraction physically isolates oil and lipid fractions from biomass using pressing, centrifugation, or solvent extraction. For oilseed crops and used cooking oil, this is a mature, widely deployed industrial process. For algae and wet food waste, the process is more energy-intensive due to dewatering and cell disruption requirements. The resulting vegetable or algal oil platform routes to biodiesel or renewable diesel production.
aliases:
  - oil extraction
  - cold pressing
  - solvent extraction
  - lipid extraction
mechanism_brief: Mechanical presses (cold press or expeller) apply pressure to oilseed or lipid-rich biomass to squeeze out oil; solvent extraction (hexane) achieves higher yields from press cake and algae; centrifugation separates liquid oil from water emulsions.
typical_outputs:
  - veg-oil
