id: fast-pyr
name: Fast pyrolysis
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Fast pyrolysis uses very rapid heating rates (100–10,000°C/s) and short vapor residence times (<2 s) to maximize bio-oil yield — typically 60–75% on a dry mass basis. The liquid product is a complex mixture of oxygenated organics that can substitute for heavy fuel oil or be upgraded to transportation fuels via hydrotreating. Fast pyrolysis is particularly well-suited to dry lignocellulosic feedstocks and is among the more commercially advanced non-combustion thermochemical routes.
aliases:
  - flash pyrolysis
  - rapid pyrolysis
mechanism_brief: Very rapid heating (100–10,000°C/s) to 400–600°C with short vapor residence times (<2 s) and immediate quenching maximizes condensable bio-oil vapors at the expense of char and non-condensable gas.
typical_outputs:
  - bio-oil
  - biochar
