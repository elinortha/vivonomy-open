id: ad
name: Anaerobic digestion
type: primary_conversion
category: cat-biochem
process_family: biochemical
description: Anaerobic digestion uses a consortium of microorganisms in the absence of oxygen to convert organic matter into biogas (methane and CO₂) and digestate. It is particularly effective on wet, biodegradable feedstocks and handles the full spectrum of organic waste — food waste, manure, sludge, energy crops — making it the most widely used biological conversion process for waste valorization globally. Digestate retains most of the original nutrient content as a valuable biofertilizer.
aliases:
  - AD
  - anaerobic digestion
  - biodigestion
  - biogasification
mechanism_brief: Sequential microbial communities — hydrolysis, acidogenesis, acetogenesis, and methanogenesis — break down organic matter in 15–30 days under anaerobic conditions; methanogens convert acetate and H₂/CO₂ to biogas (55–75% CH₄).
typical_outputs:
  - biogas
  - digestate
  - vfa
