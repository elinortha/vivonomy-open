id: combustion
name: Combustion
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Combustion is the controlled burning of biomass in air to produce heat. In industrial settings, this heat generates steam that drives a turbine for electricity generation (combined heat and power). It is the most commercially deployed bioenergy conversion route worldwide and the most straightforward to implement. All chemical complexity in the biomass is destroyed — recovering higher-value products alongside electricity is not possible in a purely combustion-based system.
aliases:
  - direct combustion
  - biomass burning
  - biomass boiler
mechanism_brief: Complete oxidation of biomass carbon and hydrogen in excess air at 800–1200°C releases heat, which raises steam to drive a turbine or is delivered directly as process heat.
typical_outputs:
  - heat-power
