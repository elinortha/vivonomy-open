id: slow-pyr
name: Slow pyrolysis
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Slow pyrolysis thermally decomposes biomass at 300–500°C under inert atmosphere with slow heating rates (1–20°C/min) and long residence times, favoring biochar production. All three pyrolysis products — biochar, bio-oil, and syngas — are generated simultaneously in proportions that shift with temperature and residence time. The syngas byproduct is typically combusted to provide process heat, and bio-oil is a secondary liquid of lower quality than fast pyrolysis bio-oil.
aliases:
  - conventional pyrolysis
  - charcoal production
  - retort pyrolysis
mechanism_brief: Slow thermal decomposition at 300–500°C with slow heating rates (1–20°C/min) and long residence times (hours) maximizes biochar yield by allowing secondary char-forming reactions to proceed.
typical_outputs:
  - biochar
  - bio-oil
  - syngas
