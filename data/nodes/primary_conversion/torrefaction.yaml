id: torrefaction
name: Torrefaction
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Torrefaction is mild pyrolysis (200–300°C) in the absence of oxygen that partially decomposes biomass, removing moisture and degrading hemicellulose while preserving most energy content in a more energy-dense solid. The torrefied product is hydrophobic, brittle, and easier to grind — properties that make it a better co-firing fuel for coal plants or a more homogeneous feedstock for gasification. Mass loss is 20–30% but energy loss is typically only 10%.
aliases:
  - mild pyrolysis
  - biomass torrefaction
  - roasting
mechanism_brief: Thermal treatment at 200–300°C under inert atmosphere decomposes hemicellulose and surface hydroxyl groups, producing a hydrophobic, grindable, energy-dense solid with 20–30% higher energy density than raw biomass.
typical_outputs:
  - biochar
