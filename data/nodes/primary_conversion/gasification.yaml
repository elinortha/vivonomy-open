id: gasification
name: Gasification
type: primary_conversion
category: cat-thermo
process_family: thermochemical
description: Gasification converts biomass into syngas (a mixture of CO, H₂, CO₂, and CH₄) by partially oxidizing it at high temperatures (700–1200°C). The syngas can be combusted for power, converted to liquid fuels via Fischer-Tropsch synthesis, or reformed to pure hydrogen. Gasification handles a wide range of dry biomass feedstocks and is one of the few routes that can access the full energy content of lignin. Tar formation and gas cleanup remain key technical challenges.
aliases:
  - biomass gasification
  - entrained-flow gasification
  - downdraft gasification
mechanism_brief: Partial oxidation of biomass at 700–1200°C with limited oxygen or steam produces a combustible syngas mixture (CO + H₂ + CO₂ + CH₄); the H₂:CO ratio is tunable via the steam-to-oxygen ratio and downstream water-gas shift.
typical_outputs:
  - syngas
  - heat-power
  - hydrogen
