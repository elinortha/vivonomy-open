id: enz-protein
name: Enzymatic protein hydrolysis
type: primary_conversion
category: cat-biochem
process_family: biochemical
description: Enzymatic protein hydrolysis uses protease enzyme cocktails to break down protein-rich biomass into free amino acids and peptide fragments. The resulting mixture can be processed into specialty chemicals, used as high-protein animal feed supplements, or serve as nitrogen sources for fermentation. This pathway is particularly relevant for waste streams with high protein content — slaughterhouse by-products, fish processing waste, and dairy whey.
aliases:
  - proteolysis
  - protein hydrolysis
  - enzymatic protein breakdown
mechanism_brief: Endoproteases (cleave internal peptide bonds) and exoproteases (cleave terminal residues) work in combination at 40–60°C and near-neutral pH to hydrolyze proteins to free amino acids and short peptides.
typical_outputs:
  - amino-acids
